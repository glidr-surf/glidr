name: Idea or board request
description: A feature, an improvement, or a board you want in the quiver.
labels: ["idea"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What's the idea?
      description: What would you like to see, and why does it matter?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Links, sketches, examples of boards/apps doing it well.
    validations:
      required: false
